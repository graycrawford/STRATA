# XcodeGen spec — a fallback if STRATA.xcodeproj ever needs regenerating:
#   brew install xcodegen && cd STRATA-visionOS && xcodegen generate
name: STRATA
options:
  bundleIdPrefix: com.optia
  deploymentTarget:
    visionOS: "2.0"
  xcodeVersion: "16.0"
targets:
  STRATA:
    type: application
    platform: visionOS
    sources:
      - path: STRATA
        excludes:
          - Info.plist
    info:
      path: STRATA/Info.plist
      properties:
        NSHandsTrackingUsageDescription: STRATA tracks your hands so you can touch and play the cloth instruments.
        NSWorldSensingUsageDescription: STRATA follows your head movement to shape the mix.
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.optia.strata
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "7"
        SUPPORTED_PLATFORMS: xros xrsimulator
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
